<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/img/web-logo.png">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=Audiowide&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
    
    <title>Verify Code | VAPE CLUSTER</title>
</head>
<body class="auth-page">
    <div class="page-wrapper">
        <div class="auth-container" style="max-width: 500px; min-height: 520px; justify-content: center;">
            <div class="auth-panel" style="flex: 1; text-align: center;">
                <div class="form-header">
                    <h2><i class="fas fa-shield-halved"></i> VERIFY CODE</h2>
                    <p>Enter the 4-digit code sent to your email.</p>
                </div>

                <form onsubmit="return false">
                    <div class="otp-container">
                        <input type="text" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp2')" id="otp1" autofocus>
                        <input type="text" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp3')" id="otp2" onkeyup="moveBack(event, 'otp1')">
                        <input type="text" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp4')" id="otp3" onkeyup="moveBack(event, 'otp2')">
                        <input type="text" maxlength="1" class="otp-input" onkeyup="moveBack(event, 'otp3')" id="otp4">
                    </div>

                    <div style="margin-bottom: 25px;">
                        <button type="submit" class="submit-btn">VERIFY & PROCEED</button>
                    </div>
                </form>

                <div class="social-login" style="margin-top: 20px;">
                    <p>Didn't receive the code?</p>
                    <a href="#" style="color: var(--primary-crimson); font-weight: 700; text-decoration: none; font-size: 13px;">Resend Code</a>
                </div>

                <div class="mobile-toggle" style="display: block; margin-top: 30px;">
                    <a href="forgot-password.html" style="color: rgba(255,255,255,0.5); font-weight: 500; text-decoration: none;"><i class="fas fa-arrow-left"></i> Back</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/script.js"></script>
    <script>
        function moveToNext(current, nextId) {
            if (current.value.length === 1 && nextId) {
                document.getElementById(nextId).focus();
            }
        }

        function moveBack(event, prevId) {
            if (event.key === "Backspace" && prevId && event.target.value === "") {
                document.getElementById(prevId).focus();
            }
        }

        // Allow only numbers
        document.querySelectorAll('.otp-input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
