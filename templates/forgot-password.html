<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/img/web-logo.png">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=Audiowide&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Forgot Password | VAPE CLUSTER</title>
</head>
<body class="auth-page">
    <div class="page-wrapper">
        <div class="auth-container" style="max-width: 500px; min-height: 480px; justify-content: center;">
            <div class="auth-panel" style="flex: 1; text-align: center;">
                <div class="form-header">
                    <h2><i class="fas fa-key"></i> RESET PASSWORD</h2>
                    <p>Enter your email address to receive a reset Code.</p>
                </div>

                <form onsubmit="window.location.href='verify-code.html'; return false;">
                    <div class="form-group text-start">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" class="form-control-custom" placeholder="Email Address" required>
                        </div>
                    </div>

                    <div style="margin-bottom: 25px;">
                        <button type="submit" class="submit-btn" id="sendCodeBtn">SEND RESET CODE</button>
                    </div>
                </form>

                <div class="mobile-toggle" style="display: block;">
                    Remember your password? <a href="login-signup.html" style="color: var(--primary-crimson); font-weight: 700; text-decoration: none;">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/script.js"></script>
</body>
</html>
